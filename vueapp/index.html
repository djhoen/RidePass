<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RidePass</title>
    <!-- PWA / "Add to Home Screen": launches chromeless (no address bar, no back/forward) so the
         POS tablet looks like a native app. The tenant favicon + name are applied at runtime in the
         branding store (iOS apple-touch-icon + an Android blob manifest); these are the fallbacks. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RidePass" />
    <link rel="apple-touch-icon" href="/pwa-icon.png" />
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
